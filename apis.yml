aid: prolaera
name: Prolaera
description: >-
  Prolaera is a learning and compliance platform built for modern CPAs and
  accounting firms, combining automated CPE (Continuing Professional Education)
  tracking, a learning management system (LMS), and a built-in course library so
  firms can administer training, monitor license and compliance requirements,
  and manage professional development in one place. Prolaera merged with LCvista
  and now operates as "Prolaera by LCvista"; the product is delivered as a
  hosted SaaS application at app.prolaera.com with SSO/SAML 2.0 identity support
  and SCORM/AICC/xAPI content compatibility. It is a portfolio company of 500
  Global. Prolaera does not currently publish a public developer API, developer
  portal, or machine-readable API specifications.
